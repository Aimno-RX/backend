<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>康复训练知识图谱助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#4f46e5;--primary-light:#818cf8;--bg:#f9fafb;--card:#fff;--text:#111827;--text-secondary:#6b7280;--border:#e5e7eb;--user-bg:#4f46e5;--user-text:#fff;--bot-bg:#fff;--bot-text:#111827;--shadow:0 1px 3px rgba(0,0,0,.1)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);height:100vh;display:flex;flex-direction:column}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.header h1{font-size:18px;font-weight:600;color:var(--text)}
.header .badge{font-size:11px;background:var(--primary-light);color:#fff;padding:2px 8px;border-radius:10px}
.settings{display:flex;gap:8px;margin-left:auto;align-items:center}
.settings select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--card);color:var(--text)}
.chat-container{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.message{display:flex;gap:10px;max-width:85%;animation:fadeIn .3s}
.message.user{align-self:flex-end;flex-direction:row-reverse}
.message.bot{align-self:flex-start}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.message.user .avatar{background:var(--primary);color:#fff}
.message.bot .avatar{background:#e0e7ff;color:var(--primary)}
.bubble{padding:12px 16px;border-radius:12px;line-height:1.6;font-size:14px;word-break:break-word}
.message.user .bubble{background:var(--user-bg);color:var(--user-text);border-bottom-right-radius:4px}
.message.bot .bubble{background:var(--bot-bg);color:var(--bot-text);border:1px solid var(--border);box-shadow:var(--shadow);border-bottom-left-radius:4px}
.bubble p{margin:0 0 8px}
.bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:4px 0 8px 20px}
.bubble code{background:#f3f4f6;padding:1px 4px;border-radius:3px;font-size:13px}
.bubble pre{background:#1e293b;color:#e2e8f0;padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0;font-size:13px}
.bubble pre code{background:none;padding:0;color:inherit}
.bubble strong{font-weight:600}
.bubble h1,.bubble h2,.bubble h3{margin:12px 0 6px;font-weight:600}
.bubble h1{font-size:18px}.bubble h2{font-size:16px}.bubble h3{font-size:15px}
.images-section{margin-top:10px}
.images-section .label{font-size:12px;color:var(--text-secondary);margin-bottom:8px;font-weight:500}
.image-grid{display:flex;flex-wrap:wrap;gap:8px}
.image-card{border:1px solid var(--border);border-radius:8px;overflow:hidden;max-width:200px;cursor:pointer;transition:transform .2s,box-shadow .2s}
.image-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.image-card img{width:100%;height:140px;object-fit:cover;display:block}
.image-card .caption{padding:6px 8px;font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.typing{display:flex;gap:4px;padding:8px 12px}
.typing span{width:6px;height:6px;background:var(--text-secondary);border-radius:50%;animation:bounce .6s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.input-area{background:var(--card);border-top:1px solid var(--border);padding:16px 20px}
.input-wrapper{display:flex;gap:10px;align-items:flex-end;max-width:900px;margin:0 auto}
.input-wrapper textarea{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;resize:none;max-height:120px;min-height:42px;line-height:1.5;outline:none;transition:border-color .2s}
.input-wrapper textarea:focus{border-color:var(--primary)}
.input-wrapper button{padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .2s}
.input-wrapper button:hover{background:#4338ca}
.input-wrapper button:disabled{background:#9ca3af;cursor:not-allowed}
.sources-section{margin-top:8px;font-size:12px;color:var(--text-secondary)}
.sources-section .label{font-weight:500;margin-bottom:4px}
.sources-section .tag{display:inline-block;background:#f3f4f6;padding:2px 8px;border-radius:4px;margin:2px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal-overlay img{max-width:90vw;max-height:90vh;border-radius:8px}
.modal-overlay .close{position:absolute;top:16px;right:20px;color:#fff;font-size:28px;cursor:pointer}
.info-section{margin-top:8px;padding:8px 10px;background:#f0f9ff;border-radius:6px;font-size:12px;color:#1e40af}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-secondary);gap:12px}
.empty-state .icon{font-size:48px}
.empty-state p{font-size:15px}
</style>
</head>
<body>

<div class="header">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg>
  <h1>康复训练知识图谱助手</h1>
  <span class="badge">Knowledge Graph</span>
  <div class="settings">
    <select id="modeSelect">
      <option value="graph_vector">知识图谱+向量</option>
      <option value="graph">知识图谱</option>
      <option value="vector">向量检索</option>
    </select>
    <select id="modelSelect">
      <option value="deepseek_chat">DeepSeek</option>
    </select>
  </div>
</div>

<div class="chat-container" id="chatContainer">
  <div class="empty-state" id="emptyState">
    <div class="icon">🧠</div>
    <p>康复训练知识图谱助手</p>
    <p style="font-size:13px">输入问题，获取康复训练指导与动作图片</p>
  </div>
</div>

<div class="input-area">
  <div class="input-wrapper">
    <textarea id="userInput" rows="1" placeholder="输入问题... (Enter发送, Shift+Enter换行)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">发送</button>
  </div>
</div>

<div class="modal-overlay" id="imageModal" onclick="this.classList.remove('active')">
  <span class="close">&times;</span>
  <img id="modalImg" src="">
</div>

<script>
const API_BASE = window.location.origin;
let sessionId = 'session-' + Date.now();
let isLoading = false;

const chatContainer = document.getElementById('chatContainer');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const emptyState = document.getElementById('emptyState');

userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
});

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function parseMarkdown(text) {
  let html = escapeHtml(text);
  // code blocks
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // headers
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // unordered lists
  html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  // ordered lists
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // paragraphs
  html = html.replace(/\n\n/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p><\/p>/g, '');
  return html;
}

function addMessage(role, content, images, sources, info) {
  if (emptyState) emptyState.remove();
  const msg = document.createElement('div');
  msg.className = `message ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '我' : 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (role === 'user') {
    bubble.textContent = content;
  } else {
    bubble.innerHTML = parseMarkdown(content);

    // images
    if (images && images.length > 0) {
      const imgSection = document.createElement('div');
      imgSection.className = 'images-section';
      imgSection.innerHTML = '<div class="label">📷 相关图片</div>';
      const grid = document.createElement('div');
      grid.className = 'image-grid';
      images.forEach(img => {
        const card = document.createElement('div');
        card.className = 'image-card';
        const imgEl = document.createElement('img');
        imgEl.src = API_BASE + img.imageUrl;
        imgEl.alt = img.exerciseName || '';
        imgEl.loading = 'lazy';
        imgEl.onclick = () => showImage(API_BASE + img.imageUrl);
        const caption = document.createElement('div');
        caption.className = 'caption';
        caption.textContent = img.exerciseName || img.description?.substring(0, 40) || '';
        card.appendChild(imgEl);
        card.appendChild(caption);
        grid.appendChild(card);
      });
      imgSection.appendChild(grid);
      bubble.appendChild(imgSection);
    }

    // info section
    if (info) {
      const infoDiv = document.createElement('div');
      infoDiv.className = 'info-section';
      const parts = [];
      if (info.model) parts.push('模型: ' + info.model);
      if (info.response_time) parts.push('耗时: ' + info.response_time + 's');
      if (info.total_tokens) parts.push('Token: ' + info.total_tokens);
      infoDiv.textContent = parts.join(' | ');
      bubble.appendChild(infoDiv);
    }

    // sources
    if (sources && sources.length > 0) {
      const srcDiv = document.createElement('div');
      srcDiv.className = 'sources-section';
      srcDiv.innerHTML = '<div class="label">来源</div>' +
        sources.map(s => `<span class="tag">${escapeHtml(s)}</span>`).join('');
      bubble.appendChild(srcDiv);
    }
  }

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatContainer.appendChild(msg);
  chatContainer.scrollTop = chatContainer.scrollHeight;
  return msg;
}

function addTyping() {
  if (emptyState) emptyState.remove();
  const msg = document.createElement('div');
  msg.className = 'message bot';
  msg.id = 'typingMsg';
  msg.innerHTML = '<div class="avatar">AI</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  chatContainer.appendChild(msg);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingMsg');
  if (t) t.remove();
}

function showImage(src) {
  document.getElementById('modalImg').src = src;
  document.getElementById('imageModal').classList.add('active');
}

async function sendMessage() {
  const q = userInput.value.trim();
  if (!q || isLoading) return;

  isLoading = true;
  sendBtn.disabled = true;
  userInput.value = '';
  userInput.style.height = 'auto';

  addMessage('user', q);
  addTyping();

  const mode = document.getElementById('modeSelect').value;
  const model = document.getElementById('modelSelect').value;

  const formData = new FormData();
  formData.append('model', model);
  formData.append('question', q);
  formData.append('document_names', JSON.stringify(['test1.docx']));
  formData.append('session_id', sessionId);
  formData.append('mode', mode);

  try {
    const resp = await fetch(API_BASE + '/chat_bot', { method: 'POST', body: formData });
    const data = await resp.json();
    removeTyping();

    if (data.status === 'Success' && data.data) {
      const d = data.data;
      addMessage('bot', d.message || 'No response', d.info?.images, d.info?.sources, d.info);
    } else {
      addMessage('bot', 'Error: ' + (data.error || data.message || 'Unknown error'));
    }
  } catch (err) {
    removeTyping();
    addMessage('bot', 'Network error: ' + err.message);
  }

  isLoading = false;
  sendBtn.disabled = false;
  userInput.focus();
}
</script>
</body>
</html>
